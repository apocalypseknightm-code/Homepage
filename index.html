<style>

@import url(
    'https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap'
);


/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: #fff;
    font-family: "Noto Sans JP", sans-serif;
    overflow-x: hidden;
}


/* =========================
   COMMON
========================= */

section {
    position: relative;
    padding: 110px 20px;
    overflow: hidden;
}

.container {
    width: min(1100px, 100%);
    margin: 0 auto;
}

.section-title {
    position: relative;
    text-align: center;
    margin-bottom: 55px;
    z-index: 2;
}

.section-title .en {
    display: block;
    color: #e60012;
    font-family: "Orbitron", sans-serif;
    font-size: 11px;
    letter-spacing: 6px;
    margin-bottom: 12px;
}

.section-title h2 {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 2px;
}

.section-title h2::after {
    content: "";
    display: block;
    width: 60px;
    height: 3px;
    margin: 18px auto 0;
    background: #e60012;
    box-shadow:
        0 0 20px rgba(230,0,18,.6);
}


/* =========================
   BACKGROUND
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;
    pointer-events: none;

    background:
        linear-gradient(
            115deg,
            transparent 0%,
            rgba(230,0,18,.02) 42%,
            rgba(230,0,18,.10) 50%,
            transparent 58%
        );
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 999;
    pointer-events: none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.015) 0px,
            rgba(255,255,255,.015) 1px,
            transparent 1px,
            transparent 4px
        );

    opacity: .25;
}


/* =========================
   HERO
========================= */

.hero {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(230,0,18,.20),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #020202,
            #0b0b0b 55%,
            #020202
        );
}

.hero-logo-bg {
    position: absolute;

    width: 850px;
    max-width: 90vw;

    opacity: .06;

    filter:
        grayscale(1)
        brightness(.7)
        drop-shadow(
            0 0 40px
            rgba(230,0,18,.4)
        );

    transform: rotate(-8deg);

    pointer-events: none;

    animation:
        slowFloat
        8s
        ease-in-out
        infinite;
}

.hero::before {
    content: "";

    position: absolute;

    width: 160%;
    height: 180px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(230,0,18,.10),
            transparent
        );

    transform: rotate(-12deg);

    animation:
        slashMove
        7s
        linear
        infinite;
}

.hero::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 50px 50px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 25%,
            black 75%,
            transparent
        );
}


/* =========================
   HERO CONTENT
========================= */

.hero-content {
    position: relative;
    z-index: 3;

    width: 100%;

    padding: 30px;
}

.logo {
    width: min(280px, 65vw);
    max-height: 280px;

    object-fit: contain;

    margin-bottom: 25px;

    filter:
        grayscale(1)
        drop-shadow(
            0 0 15px
            rgba(230,0,18,.6)
        )
        drop-shadow(
            0 0 45px
            rgba(230,0,18,.25)
        );

    animation:
        logoFloat
        4s
        ease-in-out
        infinite;
}

.hero h1 {
    position: relative;

    font-family: "Orbitron", sans-serif;

    font-size:
        clamp(
            34px,
            8vw,
            70px
        );

    font-weight: 900;

    letter-spacing: 3px;

        text-shadow:
        0 0 10px rgba(230,0,18,.8),
        0 0 30px rgba(230,0,18,.4),
        0 0 60px rgba(230,0,18,.15);

    animation:
        glitch
        5s
        infinite;
}

.hero-sub {
    margin-top: 14px;
    color: #999;
    font-family: "Orbitron", sans-serif;
    font-size: 12px;
    letter-spacing: 6px;
}

.est {
    margin-top: 10px;
    color: #555;
    font-family: "Orbitron", sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
}

.hero-buttons {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 160px;
    padding: 15px 30px;
    color: #fff;
    text-decoration: none;
    font-weight: 900;
    letter-spacing: 2px;
    border: 1px solid #e60012;
    background: rgba(230,0,18,.05);
    overflow: hidden;
    transition: .3s;
}.btn::before {
    content: "";
    position: absolute;
    width: 0;
    height: 100%;
    left: 0;
    top: 0;
    background: #e60012;
    transition: .3s;
    z-index: -1;
}

.btn:hover::before {
    width: 100%;
}

.btn:hover {
    color: #fff;
    box-shadow:
        0 0 25px rgba(230,0,18,.5);
    transform: translateY(-4px);
}

.btn-red {
    background: #e60012;
    color: #fff;
}

.scroll-down {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-family: "Orbitron", sans-serif;
    font-size: 9px;
    letter-spacing: 4px;
    color: #555;
    z-index: 4;
}

.scroll-down::after {
    content: "";
    display: block;
    width: 1px;
    height: 35px;
    background: #e60012;
    margin: 10px auto 0;
    animation: scrollLine 1.5s infinite;
}


/* =========================
   ABOUT
========================= */

.about {
    background:
        linear-gradient(
            135deg,
            #080808,
            #050505
        );
}

.about::before {
    content: "AK";
    position: absolute;
    right: -50px;
    bottom: -100px;
    font-family: "Orbitron", sans-serif;
    font-size: 300px;
    font-weight: 900;
    color: rgba(230,0,18,.025);
    pointer-events: none;
}.about-box {
    max-width: 850px;
    margin: auto;
    padding: 45px;
    position: relative;

    background:
        linear-gradient(
            135deg,
            #121212,
            #070707
        );

    border: 1px solid #222;
    border-left: 3px solid #e60012;

    box-shadow:
        0 0 50px rgba(0,0,0,.8);
}

.about-box::after {
    content: "AK MOKUSHIROKU KISHI";
    position: absolute;
    right: 20px;
    bottom: 15px;
    color: #222;
    font-family: "Orbitron", sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
}

.about-box p {
    color: #bbb;
    line-height: 2.2;
    text-align: center;
    font-size: 15px;
}


/* =========================
   STATS
========================= */

.stats {
    padding: 60px 20px;
    background: #030303;
    border-top: 1px solid #151515;
    border-bottom: 1px solid #151515;
}

.stats-grid {
    display: grid;
    grid-template-columns:
        repeat(3,1fr);
    max-width: 800px;
    margin: auto;
}

.stat {
    text-align: center;
    padding: 20px;
    border-right: 1px solid #222;
}

.stat:last-child {
    border-right: none;
}.stat-number {
    display: block;
    font-family: "Orbitron", sans-serif;
    font-size: 38px;
    font-weight: 900;
    color: #fff;
    text-shadow:
        0 0 20px rgba(230,0,18,.35);
}

.stat-label {
    display: block;
    margin-top: 8px;
    color: #666;
    font-family: "Orbitron", sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
}


/* =========================
   MEMBERS
========================= */

.members {
    background: #050505;
}

.member-list {
    display: grid;
    grid-template-columns:
        repeat(3,1fr);
    gap: 18px;
}

.member {
    position: relative;
    min-height: 260px;
    background: #0c0c0c;
    border: 1px solid #222;
    overflow: hidden;
    transition: .4s;
}

.member::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 3px;
    height: 100%;
    background: #e60012;
    box-shadow:
        0 0 20px rgba(230,0,18,.5);
    z-index: 3;
}

.member:hover {
    transform: translateY(-8px);
    border-color: #e60012;
    box-shadow:
        0 15px 40px rgba(0,0,0,.8),
        0 0 25px rgba(230,0,18,.08);
}.member-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: .65;
    transition: .5s;
    filter: grayscale(1);
}

.member:hover .member-image {
    transform: scale(1.08);
    opacity: .85;
    filter: grayscale(1);
}

.member-overlay {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to top,
            #050505 0%,
            rgba(5,5,5,.8) 35%,
            transparent 75%
        );
}

.member-content {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 18px;
    z-index: 3;
}

.member-number {
    color: #aaa;
    font-family: "Orbitron", sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
}

.member-name {
    display: block;
    margin-top: 5px;
    font-size: 21px;
    font-weight: 900;
}

.member-role {
    display: block;
    margin-top: 4px;
    color: #666;
    font-family: "Orbitron", sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
}


/* =========================
   MATCH RESULTS
========================= */

.results {
    background:
        linear-gradient(
            135deg,
            #090909,
            #050505
        );
}

.match {
    position: relative;
    padding: 35px;
    margin-bottom: 20px;
    background: #0d0d0d;
    border: 1px solid #242424;
    overflow: hidden;
    transition: .3s;
}

.match:hover {
    border-color: #e60012;
    box-shadow:
        0 0 30px rgba(230,0,18,.08);
}

.match::before {
    content: "CLAN BATTLE";
    position: absolute;
    top: 15px;
    right: 20px;
    font-family: "Orbitron", sans-serif;
    font-size: 9px;
    letter-spacing: 3px;
    color: #333;
}

.match-date {
    text-align: center;
    color: #555;
    font-family: "Orbitron", sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 25px;
}.match-vs {
    display: grid;
    grid-template-columns:
        1fr auto 1fr;
    align-items: center;
    gap: 25px;
}

.team {
    text-align: center;
}

.team-name {
    font-size: 19px;
    font-weight: 900;
}

.team-tag {
    display: block;
    margin-top: 5px;
    color: #555;
    font-family: "Orbitron", sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
}

.vs {
    font-family: "Orbitron", sans-serif;
    font-size: 15px;
    font-weight: 900;
    color: #e60012;

    text-shadow:
        0 0 15px
        rgba(230,0,18,.5);
}

.match-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 25px;
}

.result-win {
    color: #e60012;
    font-family: "Orbitron", sans-serif;
    font-weight: 900;
    font-size: 12px;
    letter-spacing: 2px;
}

.match-score {
    font-family: "Orbitron", sans-serif;
    font-size: 28px;
    font-weight: 900;
}


/* =========================
   NEWS
========================= */

.news {
    background: #050505;
}

.news-list {
    max-width: 850px;
    margin: auto;
}

.news-card {
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 25px;
    margin-bottom: 15px;
    background: #0d0d0d;
    border: 1px solid #222;
    transition: .3s;
    position: relative;
}

.news-card:hover {
    border-color: #e60012;
    transform: translateX(6px);
}

.news-date {
    min-width: 90px;
    color: #aaa;
    font-family: "Orbitron", sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
}

.news-line {
    width: 1px;
    height: 35px;
    background: #333;
}

.news-title {
    font-size: 16px;
    font-weight: 900;
}


/* =========================
   SOCIAL
========================= */

.join {
    text-align: center;

    background:
        radial-gradient(
            circle at center,
            rgba(230,0,18,.12),
            transparent 55%
        ),
        #050505;
}

.join::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    border: 1px solid rgba(230,0,18,.08);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform:
        translate(-50%,-50%);
    animation:
        rotate 30s linear infinite;
}

.join p {
    position: relative;
    color: #aaa;
    margin: 20px 0 30px;
    z-index: 2;
}

.social-buttons {
    position: relative;
    display: grid;
    grid-template-columns:
        repeat(2,minmax(250px,1fr));
    gap: 18px;
    max-width: 700px;
    margin: 35px auto 0;
    z-index: 3;
}.social-btn {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 88px;
    padding: 15px 20px;

    color: #fff;
    text-decoration: none;

    background:
        linear-gradient(
            135deg,
            rgba(20,20,20,.95),
            rgba(5,5,5,.95)
        );

    border: 1px solid #292929;
    overflow: hidden;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.social-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 2px;

    background: #e60012;

    transform: scaleX(0);
    transform-origin: left;

    transition:
        transform .4s ease;
}

.social-btn:hover {
    transform: translateY(-5px);

    border-color: #e60012;

    box-shadow:
        0 10px 35px rgba(0,0,0,.8),
        0 0 25px rgba(230,0,18,.12);
}

.social-btn:hover::before {
    transform: scaleX(1);
}


/* =========================
   SOCIAL ICON
========================= */

.social-icon {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 54px;
    height: 54px;

    margin-right: 17px;

    flex-shrink: 0;

    color: #fff;

    background: #050505;

    border: 1px solid #333;

    z-index: 2;

    transition: .3s;
}

.social-icon svg {
    width: 27px;
    height: 27px;

    display: block;

    fill: currentColor;
}

.social-btn:hover .social-icon {
    border-color: #e60012;

    box-shadow:
        0 0 20px
        rgba(230,0,18,.2);

    transform: scale(1.05);
}


/* =========================
   SOCIAL TEXT
========================= */

.social-text {
    position: relative;

    display: flex;
    flex-direction: column;
    align-items: flex-start;

    z-index: 2;
}

.social-text small {
    color: #666;

    font-family: "Orbitron", sans-serif;

    font-size: 8px;

    letter-spacing: 2px;

    margin-bottom: 5px;
}

.social-text strong {
    font-family: "Orbitron", sans-serif;

    font-size: 14px;

    letter-spacing: 1px;
}

.social-arrow {
    position: relative;

    margin-left: auto;

    color: #555;

    font-family: "Orbitron", sans-serif;

    font-size: 20px;

    z-index: 2;

    transition: .3s;
}

.social-btn:hover .social-arrow {
    color: #e60012;

    transform:
        translate(4px,-4px);
}<!-- フッターアニメーション -->

<style>
.site-footer {
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 70px 20px 35px;
    background: #080808;
    color: #fff;
}

.footer-line {
    width: 80px;
    height: 2px;
    margin: 0 auto 30px;
    background: #fff;
    box-shadow: 0 0 12px rgba(255,255,255,.8);
    animation: footerLine 2s ease-in-out infinite alternate;
}

.footer-logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 5px;
    text-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 25px rgba(255,255,255,.4);
    animation: footerGlow 2s ease-in-out infinite alternate;
}

.footer-title {
    margin: 12px 0 4px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
}

.footer-sub {
    margin: 0;
    font-size: 11px;
    letter-spacing: 4px;
    opacity: .55;
}

.copyright {
    margin-top: 35px;
    font-size: 10px;
    opacity: .35;
    letter-spacing: 1px;
}

/* 光のライン */
@keyframes footerLine {
    from {
        width: 50px;
        opacity: .4;
    }
    to {
        width: 130px;
        opacity: 1;
    }
}

/* AKの発光 */
@keyframes footerGlow {
    from {
        opacity: .65;
        transform: scale(.98);
    }
    to {
        opacity: 1;
        transform: scale(1.03);
    }
}

/* 浮遊する光 */
.footer-particles {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 180px;
    pointer-events: none;
    overflow: hidden;
}

.footer-particles span {
    position: absolute;
    bottom: -10px;
    width: 3px;
    height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px #fff;
    animation: particleUp linear infinite;
}

.footer-particles span:nth-child(1) {
    left: 8%;
    animation-duration: 5s;
}
.footer-particles span:nth-child(2) {
    left: 18%;
    animation-duration: 7s;
}
.footer-particles span:nth-child(3) {
    left: 28%;
    animation-duration: 4s;
}
.footer-particles span:nth-child(4) {
    left: 38%;
    animation-duration: 6s;
}
.footer-particles span:nth-child(5) {
    left: 48%;
    animation-duration: 5s;
}
.footer-particles span:nth-child(6) {
    left: 58%;
    animation-duration: 8s;
}
.footer-particles span:nth-child(7) {
    left: 68%;
    animation-duration: 4s;
}
.footer-particles span:nth-child(8) {
    left: 78%;
    animation-duration: 6s;
}
.footer-particles span:nth-child(9) {
    left: 88%;
    animation-duration: 5s;
}
.footer-particles span:nth-child(10) {
    left: 95%;
    animation-duration: 7s;
}

@keyframes particleUp {
    0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    80% {
        opacity: .4;
    }

    100% {
        transform: translateY(-180px) scale(1.2);
        opacity: 0;
    }
}
</style>
